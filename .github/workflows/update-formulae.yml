name: Update formulae

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Skip while an automated update is open
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count="$(gh pr list --state open --json headRefName,isCrossRepository --jq '[.[] | select((.isCrossRepository | not) and (.headRefName | startswith("automation/formula-updates-")))] | length')"
          echo "skip=$([[ "$count" -gt 0 ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Update formulae
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_formulae.py
      - name: Open update pull request
        if: steps.existing.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            exit 0
          fi
          branch="automation/formula-updates-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add Formula
          git commit -m "chore: update formulae"
          git push origin "$branch"
          test_run_url="$(gh workflow run test-formulae.yml --ref "$branch")"
          test_run_id="${test_run_url##*/}"
          if [[ ! "$test_run_id" =~ ^[0-9]+$ ]]; then
            echo "Could not resolve formula test run from: $test_run_url" >&2
            exit 1
          fi
          gh run watch "$test_run_id" --exit-status
          gh pr create \
            --base main \
            --head "$branch" \
            --title "chore: update formulae" \
            --body "Automated update from the latest synapt and gitgrip releases. The required macOS and Linux formula checks passed on this exact head before the PR was opened."
