name: Update formulae

on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: update-formulae
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Update formulae
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_formulae.py
      - name: Publish tested formula update
        env:
          GH_TOKEN: ${{ github.token }}
        # Opens exactly one PR per set of Formula bytes (a second run with the same
        # bumps resolves to the same branch and PR; different bytes close the stale
        # candidate) and then FAILS with the PR URL for a person to merge: the
        # workflow token cannot satisfy main's required checks. Witness:
        # scripts/tests/test_publish_formula_update.sh.
        run: scripts/publish_formula_update.sh
